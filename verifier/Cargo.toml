[package]
name = "horkos-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Horkos delivery verifier: runs in NEAR OutLayer's TEE (WASI P2)"

# Standalone: built for wasm32-wasip2, not part of the contracts workspace.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "horkos-verifier"
path = "src/main.rs"

[dependencies]
crypto_box = { version = "=0.9.1", features = ["seal", "std"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
sha2 = "=0.10.9"
jsonschema = { version = "=0.59.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
hex = "=0.4.3"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "=0.2.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
