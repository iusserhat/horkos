    <main id="main"><noscript><div class="wrap"><h2>Horkos</h2><p>Escrow for purchases made by AI agents on NEAR testnet. Each order locks its price in a contract and mints an NFT receipt. The seller is paid only if the owner's on-chain mandate allows the order and a verifier running in NEAR OutLayer's TEE confirms the delivery matches the listing's JSON Schema; otherwise anyone can refund the order after its deadline. On the v2 contract the receipt can be passed on, and the data or the refund goes to whoever holds it.</p>
<p>Check it: <a href="https://github.com/iusserhat/horkos">source code</a> · <a href="https://github.com/iusserhat/horkos/blob/main/JUDGES.md">JUDGES.md</a> · <a href="https://github.com/iusserhat/horkos/blob/main/AGENTS.md">AGENTS.md</a> · <a href="https://github.com/iusserhat/horkos/blob/main/CLAIMS.md">CLAIMS.md</a> (every claim with a command or transaction) · <a href="https://github.com/iusserhat/horkos/blob/main/docs/testnet.md">testnet transactions</a> · <a href="https://github.com/iusserhat/horkos/blob/main/evidence/attestation/README.md">TEE attestations</a> · <a href="https://horkos-escrow.netlify.app/llms.txt">llms.txt</a>. Run <code>npm run judge</code> in the repo (no keys). MCP server: <code>npx -y horkos-mcp</code>.</p>
<p>Contracts: escrow.horkos.testnet (v1), escrow-v2.horkos.testnet (v2, transferable receipts), tusdc.horkos.testnet, faucet.horkos.testnet. Testnet only; the contract trusts OutLayer's operator for the verification result (attestations are checked off-chain).</p><p>This is the home page: how an order moves (agent orders within its mandate, the seller delivers real-world data encrypted, a TEE checks it before payment, the order closes on an NFT receipt), the demo video, and what Horkos adds for agent owners, sellers and NEAR. Example settled order: <a href="https://testnet.nearblocks.io/txns/22SUFSDMVzJ2N2Joq37m9dNSKvTzM3YyPTQrfMXwC3hs">order 26</a>; v2 settlement after a receipt transfer: <a href="https://testnet.nearblocks.io/txns/C1BTBTksm2foRkPWLzuKKeNqfJi5Kz2fgH3474uGN8FS">order 1 on v2</a>.</p><h3>An NFT that holds money and carries the claim</h3><ul><li>It holds the order's money: 5 tUSDC stays locked until the delivery is checked. <a href="https://horkos-escrow.netlify.app/explorer.html#receipts">Live receipts</a></li><li>Pass it on and the claim moves with it: the refund goes to whoever holds it. <a href="https://testnet.nearblocks.io/txns/CLQE8n9UKcBv9jRB1W1ukFXTfrQ7DfmL6Wq6z5G61f4w">Transfer</a>, <a href="https://testnet.nearblocks.io/txns/4NFBbMtoh9cmkm8HoWW8b1ty41GcB3A3yoL4KWF66tti">refund to the new holder</a></li><li>The new holder opens the data, the original buyer can't. <a href="https://testnet.nearblocks.io/txns/C1BTBTksm2foRkPWLzuKKeNqfJi5Kz2fgH3474uGN8FS">Settlement</a>, <a href="https://horkos-escrow.netlify.app/explorer.html?contract=v2#receipts">v2 receipts</a></li></ul></div></noscript></main>
